<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e2436" />
      <stop offset="55%" stop-color="#111520" />
      <stop offset="100%" stop-color="#0b0e16" />
    </linearGradient>
    <radialGradient id="sheen" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(14 8) rotate(45) scale(46)">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.24" />
      <stop offset="55%" stop-color="#38bdf8" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="bed" x1="36" y1="22" x2="48" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="accent" x1="16" y1="16" x2="34" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <!-- Squircle Liquid Glass Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg)" />
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#sheen)" />
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="15.25" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5" />

  <!-- Subtle Room Floor -->
  <rect x="14" y="13" width="36" height="38" rx="3" fill="#ffffff" fill-opacity="0.06" />

  <!-- Outer Room Walls (with bottom-left door gap) -->
  <path
    d="M14 51 V13 H50 V51 H27"
    stroke="#e2e8f0"
    stroke-width="2.8"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Top Window Accent -->
  <line x1="21" y1="13" x2="33" y2="13" stroke="#38bdf8" stroke-width="3.2" stroke-linecap="round" />

  <!-- Interior Dressing Room Partition -->
  <path
    d="M27 40 H50 M27 40 V51"
    stroke="#94a3b8"
    stroke-width="2.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Furniture Blocks (Desk + Bed + Side Table) -->
  <rect x="18" y="17.5" width="14" height="7" rx="2" fill="url(#accent)" />
  <rect x="36.5" y="18.5" width="9.5" height="17.5" rx="2.2" fill="url(#bed)" />
  <rect x="38.2" y="20.2" width="6.1" height="3.2" rx="1" fill="#94a3b8" />
  <rect x="18.5" y="29" width="7.5" height="7.5" rx="2" fill="#e2e8f0" fill-opacity="0.72" />
</svg>
